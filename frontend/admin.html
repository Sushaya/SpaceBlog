<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - BlogSpace</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- Header Navigation -->
    <header class="navbar">
        <div class="nav-container">
            <a href="/index.html" class="brand-logo">
                <div class="logo-icon">B</div>
                <span class="logo-text">Blog<span class="logo-accent">Space</span> <span style="font-size:0.8rem; font-weight:600; vertical-align:middle;" class="badge">Admin</span></span>
            </a>

            <ul class="nav-links">
                <li><a href="/index.html" class="nav-link">Back to Site</a></li>
            </ul>

            <div style="display:flex; align-items:center; gap:0.5rem;">
                <button id="theme-toggle-btn" class="btn-icon" title="Toggle Theme">
                    <span id="theme-toggle-icon">🌙</span>
                </button>
                <div id="nav-user-area"></div>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="main-container">
        <h1 class="auth-title" style="margin-bottom:1.5rem;">Platform Administration</h1>

        <!-- Stats Overview Cards -->
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-icon">👥</div>
                <div>
                    <div id="stat-total-users" class="stat-value">0</div>
                    <div class="stat-label">Total Users</div>
                </div>
            </div>

            <div class="stat-card">
                <div class="stat-icon">📝</div>
                <div>
                    <div id="stat-total-posts" class="stat-value">0</div>
                    <div class="stat-label">Total Posts</div>
                </div>
            </div>

            <div class="stat-card">
                <div class="stat-icon">💬</div>
                <div>
                    <div id="stat-total-comments" class="stat-value">0</div>
                    <div class="stat-label">Total Comments</div>
                </div>
            </div>

            <div class="stat-card">
                <div class="stat-icon">🔑</div>
                <div>
                    <div id="stat-total-logs" class="stat-value">0</div>
                    <div class="stat-label">User Logins & Logs</div>
                </div>
            </div>

            <div class="stat-card">
                <div class="stat-icon">🚩</div>
                <div>
                    <div id="stat-pending-reports" class="stat-value">0</div>
                    <div class="stat-label">Pending Reports</div>
                </div>
            </div>
        </div>

        <!-- Admin Management Tabs -->
        <div class="profile-tabs" style="justify-content:flex-start; margin-bottom:1.5rem;">
            <div class="profile-tab admin-tab active" data-admin-tab="logs">Login & Logout Activity Logs</div>
            <div class="profile-tab admin-tab" data-admin-tab="users">Manage Users</div>
            <div class="profile-tab admin-tab" data-admin-tab="posts">Manage Posts</div>
            <div class="profile-tab admin-tab" data-admin-tab="comments">Manage Comments</div>
            <div class="profile-tab admin-tab" data-admin-tab="reports">Moderation Reports</div>
        </div>

        <!-- Admin Tab Content Area -->
        <div id="admin-tab-content">
            <!-- Table rendered dynamically via admin.js -->
        </div>
    </main>

    <!-- Scripts -->
    <script src="js/api.js"></script>
    <script src="js/app.js"></script>
    <script src="js/admin.js"></script>
</body>
</html>
