<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Account Settings & Privacy - BlogSpace</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="manifest" href="manifest.json">
</head>
<body>

    <!-- Header Navigation -->
    <header class="navbar">
        <div class="nav-container">
            <a href="/index.html" class="brand-logo">
                <div class="logo-icon">B</div>
                <span class="logo-text">Blog<span class="logo-accent">Space</span></span>
            </a>

            <ul class="nav-links">
                <li><a href="/index.html" class="nav-link">Home</a></li>
                <li><a href="/explore.html" class="nav-link">Explore</a></li>
                <li><a href="/communities.html" class="nav-link">Communities</a></li>
                <li><a href="/reels.html" class="nav-link">Reels</a></li>
                <li><a href="/dashboard.html" class="nav-link">Dashboard</a></li>
            </ul>

            <div style="display:flex; align-items:center; gap:0.5rem;">
                <button id="theme-toggle-btn" class="btn-icon" title="Toggle Theme">
                    <span id="theme-toggle-icon">🌙</span>
                </button>
                <div id="nav-user-area"></div>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="main-container" style="max-width:720px;">
        <h1 class="auth-title" style="margin-bottom:1.5rem;">Account Settings & Privacy</h1>

        <div class="card" style="padding:2rem;">
            <form id="settings-form">
                <h3 style="border-bottom:1px solid var(--border-color); padding-bottom:0.75rem; margin-bottom:1.5rem;">Professional Information</h3>

                <div class="form-group">
                    <label class="form-label">Profession / Job Title</label>
                    <input type="text" id="set-profession" class="form-input" placeholder="Senior Software Engineer, Photographer, Journalist">
                </div>

                <div class="form-group">
                    <label class="form-label">Location</label>
                    <input type="text" id="set-location" class="form-input" placeholder="Mumbai, India or Remote">
                </div>

                <div class="form-group">
                    <label class="form-label">Website URL</label>
                    <input type="text" id="set-website" class="form-input" placeholder="https://yourwebsite.com">
                </div>

                <div class="form-group">
                    <label class="form-label">Skills (Comma separated)</label>
                    <input type="text" id="set-skills" class="form-input" placeholder="JavaScript, Node.js, React, Photography">
                </div>

                <div class="form-group">
                    <label class="form-label">Education</label>
                    <input type="text" id="set-education" class="form-input" placeholder="B.Sc. Computer Science, University of Mumbai">
                </div>

                <h3 style="border-bottom:1px solid var(--border-color); padding-bottom:0.75rem; margin-bottom:1.5rem; margin-top:2rem;">Privacy & Controls</h3>

                <div class="form-group">
                    <label class="form-label">Profile Visibility</label>
                    <select id="set-privacy-profile" class="form-input">
                        <option value="public">Public (Everyone can view profile & posts)</option>
                        <option value="followers">Followers Only (Only approved followers can view)</option>
                        <option value="private">Private (Only me)</option>
                    </select>
                </div>

                <div class="form-group">
                    <label class="form-label">Who can message you?</label>
                    <select id="set-privacy-messages" class="form-input">
                        <option value="everyone">Everyone</option>
                        <option value="followers">Followers Only</option>
                        <option value="nobody">Nobody</option>
                    </select>
                </div>

                <div style="display:flex; justify-content:flex-end; gap:0.75rem; margin-top:2rem;">
                    <button type="submit" class="btn btn-primary">Save Settings</button>
                </div>
            </form>
        </div>
    </main>

    <!-- Scripts -->
    <script src="js/api.js"></script>
    <script src="js/app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            if (!API.isAuthenticated()) {
                window.location.href = '/login.html';
                return;
            }
            try {
                const data = await API.get('/auth/me');
                const u = data.user;

                document.getElementById('set-profession').value = u.profession || '';
                document.getElementById('set-location').value = u.location || '';
                document.getElementById('set-website').value = u.website || '';
                document.getElementById('set-skills').value = u.skills || '';
                document.getElementById('set-education').value = u.education || '';
                document.getElementById('set-privacy-profile').value = u.privacy_profile || 'public';
                document.getElementById('set-privacy-messages').value = u.privacy_messages || 'everyone';

                document.getElementById('settings-form').onsubmit = async (e) => {
                    e.preventDefault();
                    try {
                        const payload = {
                            profession: document.getElementById('set-profession').value.trim(),
                            location: document.getElementById('set-location').value.trim(),
                            website: document.getElementById('set-website').value.trim(),
                            skills: document.getElementById('set-skills').value.trim(),
                            education: document.getElementById('set-education').value.trim(),
                            privacy_profile: document.getElementById('set-privacy-profile').value,
                            privacy_messages: document.getElementById('set-privacy-messages').value
                        };
                        const res = await API.put(`/users/${u.id}`, payload);
                        API.setUser(res.user);
                        showToast('Settings & Privacy updated successfully!', 'success');
                    } catch (err) {
                        showToast('Failed to save settings.', 'error');
                    }
                };
            } catch (err) {
                console.error(err);
            }
        });
    </script>
</body>
</html>
