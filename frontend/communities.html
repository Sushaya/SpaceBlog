<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Discover Communities - BlogSpace</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="manifest" href="manifest.json">
</head>
<body>

    <!-- Header Navigation -->
    <header class="navbar">
        <div class="nav-container">
            <a href="/index.html" class="brand-logo">
                <div class="logo-icon">B</div>
                <span class="logo-text">Blog<span class="logo-accent">Space</span></span>
            </a>

            <div class="nav-search-wrap">
                <input type="text" id="nav-search-input" class="nav-search-input" placeholder="Search communities, topics...">
            </div>

            <ul class="nav-links">
                <li><a href="/index.html" class="nav-link">Home</a></li>
                <li><a href="/explore.html" class="nav-link">Explore</a></li>
                <li><a href="/communities.html" class="nav-link active">Communities</a></li>
                <li><a href="/reels.html" class="nav-link">Reels</a></li>
                <li><a href="/dashboard.html" class="nav-link">Dashboard</a></li>
            </ul>

            <div style="display:flex; align-items:center; gap:0.5rem;">
                <button id="btn-create-community" class="btn btn-primary btn-sm">+ Create Community</button>
                <button id="theme-toggle-btn" class="btn-icon" title="Toggle Theme">
                    <span id="theme-toggle-icon">🌙</span>
                </button>
                <div id="nav-user-area"></div>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="main-container">
        <div style="margin-bottom:1.5rem;">
            <h1 class="auth-title" style="margin:0;">Explore Communities</h1>
            <p style="color:var(--text-muted); margin-top:0.25rem;">Join Reddit-style sub-communities around software development, AI, photography, travel, and research.</p>
        </div>

        <div id="communities-grid-container" class="posts-grid-layout">
            <div class="skeleton" style="height:220px;"></div>
            <div class="skeleton" style="height:220px;"></div>
        </div>
    </main>

    <!-- Create Community Modal -->
    <div id="create-community-modal" class="modal-overlay">
        <div class="modal-content">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:1rem;">
                <h3>🌐 Create New Community</h3>
                <button id="close-community-modal-btn" class="btn-icon">✕</button>
            </div>
            <form id="create-community-form">
                <div class="form-group">
                    <label class="form-label">Community Name</label>
                    <input type="text" id="comm-name" class="form-input" placeholder="e.g. Artificial Intelligence" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Description</label>
                    <textarea id="comm-desc" class="form-input" rows="3" placeholder="What is this community about?"></textarea>
                </div>
                <div class="form-group">
                    <label class="form-label">Icon Image URL (Optional)</label>
                    <input type="text" id="comm-icon" class="form-input" placeholder="https://example.com/icon.png">
                </div>
                <div class="form-group">
                    <label class="form-label">Community Rules</label>
                    <textarea id="comm-rules" class="form-input" rows="3" placeholder="1. Respect members&#10;2. No spam"></textarea>
                </div>
                <div style="display:flex; justify-content:flex-end; gap:0.5rem; margin-top:1.5rem;">
                    <button type="button" onclick="document.getElementById('create-community-modal').classList.remove('active')" class="btn btn-secondary btn-sm">Cancel</button>
                    <button type="submit" class="btn btn-primary btn-sm">Create Community</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Scripts -->
    <script src="js/api.js"></script>
    <script src="js/app.js"></script>
    <script src="js/communities.js"></script>
</body>
</html>
