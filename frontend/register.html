<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - BlogSpace</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- Header Navigation -->
    <header class="navbar">
        <div class="nav-container">
            <a href="/index.html" class="brand-logo">
                <div class="logo-icon">B</div>
                <span class="logo-text">Blog<span class="logo-accent">Space</span></span>
            </a>

            <div style="display:flex; align-items:center; gap:0.5rem;">
                <button id="theme-toggle-btn" class="btn-icon" title="Toggle Theme">
                    <span id="theme-toggle-icon">🌙</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Sign Up Auth Container -->
    <main class="auth-page">
        <div class="auth-card">
            <div class="auth-header">
                <h1 class="auth-title">Create Account</h1>
                <p class="auth-subtitle">Join the BlogSpace community and publish your stories</p>
            </div>

            <div id="register-alert" class="alert-error"></div>

            <form id="register-form">
                <div class="form-group">
                    <label class="form-label" for="full_name">Full Name</label>
                    <input type="text" id="full_name" class="form-input" placeholder="e.g. Alex Rivera" required>
                </div>

                <div class="form-group">
                    <label class="form-label" for="username">Username</label>
                    <input type="text" id="username" class="form-input" placeholder="e.g. alexrivera" required>
                </div>

                <div class="form-group">
                    <label class="form-label" for="email">Email Address</label>
                    <input type="email" id="email" class="form-input" placeholder="alex@example.com" required>
                </div>

                <div class="form-group">
                    <label class="form-label" for="password">Password</label>
                    <div class="input-password-wrapper">
                        <input type="password" id="password" class="form-input" placeholder="At least 6 characters" required>
                        <button type="button" class="password-toggle" title="Show/Hide Password">👁️</button>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label" for="confirm_password">Confirm Password</label>
                    <div class="input-password-wrapper">
                        <input type="password" id="confirm_password" class="form-input" placeholder="Re-enter password" required>
                        <button type="button" class="password-toggle" title="Show/Hide Password">👁️</button>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary btn-full" style="margin-top:1rem;">
                    <span>Sign Up</span>
                </button>
            </form>

            <div class="auth-footer">
                <p>Already have an account? <a href="/login.html">Log In</a></p>
            </div>
        </div>
    </main>

    <!-- Scripts -->
    <script src="js/api.js"></script>
    <script src="js/app.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
