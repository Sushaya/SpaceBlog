<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log In - BlogSpace</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- Header Navigation -->
    <header class="navbar">
        <div class="nav-container">
            <a href="/index.html" class="brand-logo">
                <div class="logo-icon">B</div>
                <span class="logo-text">Blog<span class="logo-accent">Space</span></span>
            </a>

            <div style="display:flex; align-items:center; gap:0.5rem;">
                <button id="theme-toggle-btn" class="btn-icon" title="Toggle Theme">
                    <span id="theme-toggle-icon">🌙</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Login Auth Container -->
    <main class="auth-page">
        <div class="auth-card">
            <div class="auth-header">
                <h1 class="auth-title">Welcome Back</h1>
                <p class="auth-subtitle">Log in to manage your posts and interact with writers</p>
            </div>

            <div id="login-alert" class="alert-error"></div>

            <form id="login-form">
                <div class="form-group">
                    <label class="form-label" for="credential">Email or Username</label>
                    <input type="text" id="credential" class="form-input" placeholder="alexrivera or alex@example.com" required>
                </div>

                <div class="form-group">
                    <label class="form-label" for="password">Password</label>
                    <div class="input-password-wrapper">
                        <input type="password" id="password" class="form-input" placeholder="••••••••" required>
                        <button type="button" class="password-toggle" title="Show/Hide Password">👁️</button>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary btn-full" style="margin-top:1rem;">
                    <span>Log In</span>
                </button>
            </form>

            <div class="auth-footer">
                <p>Don't have an account? <a href="/register.html">Sign Up</a></p>
            </div>
        </div>
    </main>

    <!-- Scripts -->
    <script src="js/api.js"></script>
    <script src="js/app.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
